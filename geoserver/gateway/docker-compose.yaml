services:
  ldap:
    image: georchestra/ldap:latest
    restart: always
    ports:
      - 3891:389
    ulimits:
          nofile:
            soft: "1024"
            hard: "1024"

  gateway:
    image: georchestra/gateway:latest-debug
    depends_on:
      - ldap
    volumes:
      - ./datadir:/etc/georchestra
    environment:
      - JAVA_TOOL_OPTIONS=-Dgeorchestra.datadir=/etc/georchestra
    restart: always
    ports:
      - "8080:8080"

  geoserver:
    image: georchestra/geoserver:3.0.2-georchestra
    environment:
    - GEOSERVER_CSRF_DISABLED=true
    - JAVA_OPTIONS=-Xdebug -Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=0.0.0.0:5005
    volumes:
    - ./datadir:/etc/georchestra
    ports:
    - "5005:5005"
