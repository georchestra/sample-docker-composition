name: maelstro-datafeeder

volumes:
  postgresql_data:
  ldap_data:
  ldap_config:
  geoserver_geodata:
  geoserver_datadir:
  geoserver_tiles:
  geoserver_native_libs:
  geonetwork_datadir:
  esdata:
  datadb_data:

secrets:
  slapd_password:
    file: ./secrets/slapd_password.txt
  geoserver_privileged_user_passwd:
    file: ./secrets/geoserver_privileged_user_passwd.txt

services:
  database:
    image: georchestra/database:26.0.1
    env_file: [./envs/database-georchestra.env]
    volumes: [postgresql_data:/var/lib/postgresql]
    restart: no

  datafeeder-db-init:
    image: georchestra/database:26.0.1
    depends_on:
      database:
        condition: service_healthy
    env_file: [./envs/database-georchestra.env]
    volumes:
      - ./config/database/datafeeder-init.sql:/datafeeder-init.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        psql -h database -U $$PGUSER -d $$PGDATABASE -Atc
        "select to_regclass('datafeeder.integrity_link') is not null" | grep -qx t ||
        psql -v ON_ERROR_STOP=1 -h database -U $$PGUSER -d $$PGDATABASE
        -f /datafeeder-init.sql
    restart: no

  ldap:
    image: georchestra/ldap:26.0.x
    secrets: [slapd_password, geoserver_privileged_user_passwd]
    environment:
      SLAPD_ORGANISATION: georchestra
      SLAPD_DOMAIN: georchestra.org
      SLAPD_PASSWORD_FILE: /run/secrets/slapd_password
      SLAPD_PASSWORD: ""
      GEOSERVER_PRIVILEGED_USER_PASSWORD_FILE: /run/secrets/geoserver_privileged_user_passwd
      SLAPD_LOG_LEVEL: 32768
      RUN_AS_UID: 0
      RUN_AS_GID: 0
      LDAPHOST: localhost
    env_file: [./envs/ldap.env]
    volumes: [ldap_data:/var/lib/ldap, ldap_config:/etc/ldap]
    restart: no

  gateway:
    image: georchestra/gateway:3.1.1-debug
    depends_on: [database]
    volumes: [./config:/etc/georchestra:ro]
    environment:
      JAVA_TOOL_OPTIONS: -Dgeorchestra.datadir=/etc/georchestra
    env_file:
      - ./envs/common.env
      - ./envs/ldap.env
      - ./envs/hosts.env
      - ./envs/database-georchestra.env
    restart: no
    ports: ["127.0.0.1:8088:8080"]

  geoserver:
    image: georchestra/geoserver:2.28.6-georchestra-00
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f 'http://localhost:8080/geoserver/ows?SERVICE=WMS&LAYERS=geor:public_layer&FORMAT=image/png&VERSION=1.3.0&SLD_VERSION=1.1.0&REQUEST=GetMap&CRS=EPSG:3857&BBOX=-20820223,-20820223,20820223,20820223&WIDTH=10&HEIGHT=10' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    depends_on:
      ldap: {condition: service_healthy}
      database: {condition: service_healthy}
    volumes:
      - ./config:/etc/georchestra:ro
      - geoserver_datadir:/mnt/geoserver_datadir
      - geoserver_geodata:/mnt/geoserver_geodata
      - geoserver_tiles:/mnt/geoserver_tiles
      - geoserver_native_libs:/mnt/geoserver_native_libs
    environment:
      JAVA_OPTIONS: -Dorg.eclipse.jetty.annotations.AnnotationParser.LEVEL=OFF -DGEOSERVER_CSRF_WHITELIST=georchestra-127-0-0-1.nip.io
      XMS: 256M
      XMX: 8G
    env_file: [./envs/database-georchestra.env, ./envs/database-datafeeder.env]
    restart: no

  console:
    image: georchestra/console:26.0.x
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8080/console/account/new >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    depends_on:
      ldap: {condition: service_healthy}
      database: {condition: service_healthy}
    volumes: [./config:/etc/georchestra:ro]
    environment:
      JAVA_OPTIONS: -Dorg.eclipse.jetty.annotations.AnnotationParser.LEVEL=OFF
      XMS: 256M
      XMX: 1G
    env_file: [./envs/common.env, ./envs/ldap.env, ./envs/database-georchestra.env, ./envs/hosts.env]
    restart: no

  geonetwork:
    image: georchestra/geonetwork:4.4.12-georchestra-01
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8080/geonetwork/srv/eng/catalog.search >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    depends_on:
      console: {condition: service_healthy}
      database: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
    volumes: [./config:/etc/georchestra:ro, geonetwork_datadir:/mnt/geonetwork_datadir]
    environment:
      JAVA_OPTIONS: -Duser.home=/tmp/jetty -Dgeorchestra.datadir=/etc/georchestra -Xdebug -Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=5005 -Dorg.eclipse.jetty.annotations.AnnotationParser.LEVEL=OFF
      XMS: 256M
      XMX: 6G
    env_file: [./envs/hosts.env, ./envs/database-georchestra.env, ./envs/.envs-elastic]
    restart: no

  datadb:
    image: postgis/postgis:18-3.6
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: postgres
    volumes: [datadb_data:/var/lib/postgresql]
    configs:
      - source: datadb_init_sql
        target: /docker-entrypoint-initdb.d/01-data-db-init.sql
    restart: no

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.13
    ulimits:
      memlock: {soft: -1, hard: -1}
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:$$ELASTIC_PASSWORD -s -f http://localhost:9200/_cat/health  >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    env_file:
      - ./envs/.envs-elastic
    restart: no

  caddy:
    image: caddy:2.8-alpine
    networks:
      default:
        aliases: [georchestra-127-0-0-1.nip.io]
    environment:
      CADDY_ADMIN: 0.0.0.0:2019
    volumes:
      - ./resources/caddy/etc:/etc/caddy:ro
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:2019/reverse_proxy/upstreams >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    env_file: [./envs/common.env]

  maelstro-front:
    image: ${MAELSTRO_FRONT_IMAGE:-georchestra/maelstro-frontend:latest}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/maelstro/"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
    volumes:
      - ./config:/etc/georchestra:ro
      - ./config/maelstro:/etc/maelstro:ro
    environment:
      CUSTOM_SCRIPTS_DIRECTORY: /etc/maelstro/scripts
      MAELSTRO_BACK_HOST: maelstro-backend
    restart: no

  maelstro-backend:
    image: ${MAELSTRO_BACK_IMAGE:-georchestra/maelstro-backend:latest}
    healthcheck:
      test: health_check
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
    volumes:
      - ./config/maelstro:/etc/maelstro:ro
    environment:
      MAELSTRO_CONFIG: /etc/maelstro/config.yaml
      DEMO_LOGIN: testadmin
      DEMO_PASSWORD: testadmin
      LOCAL_LOGIN: testadmin
      LOCAL_PASSWORD: testadmin
      SOURCE_GEOSERVER_PUBLIC_URL: https://georchestra-127-0-0-1.nip.io:${CADDY_HTTPS_PORT:-8443}/geoserver
      DESTINATION_GEONETWORK_URL: ${DESTINATION_GEONETWORK_URL:-}
      DESTINATION_GEOSERVER_URL: ${DESTINATION_GEOSERVER_URL:-}
      DESTINATION_DATAFEEDER_URL: ${DESTINATION_DATAFEEDER_URL:-}
      DESTINATION_LOGIN: ${DESTINATION_LOGIN:-}
      DESTINATION_PASSWORD: ${DESTINATION_PASSWORD:-}
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: georchestra
      PGUSER: georchestra
      PGPASSWORD: georchestra
    command: [serve_docker_dev]
    ports: ["127.0.0.1:8000:8000"]
    restart: no

  check:
    image: ${MAELSTRO_BACK_IMAGE:-georchestra/maelstro-backend:latest}
    profiles: [check]
    environment:
      MAELSTRO_CONFIG: /etc/maelstro/config.yaml
      LOCAL_LOGIN: testadmin
      LOCAL_PASSWORD: testadmin
      SOURCE_GEOSERVER_PUBLIC_URL: https://georchestra-127-0-0-1.nip.io:${CADDY_HTTPS_PORT:-8443}/geoserver
      DESTINATION_GEONETWORK_URL: ${DESTINATION_GEONETWORK_URL:-}
      DESTINATION_GEOSERVER_URL: ${DESTINATION_GEOSERVER_URL:-}
      DESTINATION_DATAFEEDER_URL: ${DESTINATION_DATAFEEDER_URL:-}
      DESTINATION_LOGIN: ${DESTINATION_LOGIN:-}
      DESTINATION_PASSWORD: ${DESTINATION_PASSWORD:-}
    volumes: [./config/maelstro:/etc/maelstro:ro]

  datahub:
    image: geonetwork/geonetwork-ui-datahub:latest
    restart: no

  metadata-editor:
    image: geonetwork/geonetwork-ui-metadata-editor:latest
    restart: no

  datafeeder-frontend:
    image: georchestra/datafeeder-python-frontend:latest
    volumes:
      - ./config:/etc/georchestra:ro
    environment:
      ENABLE_GEORCHESTRA_HEADER: "true"
      CONFIG_DIRECTORY_OVERRIDE: /etc/georchestra/datafeeder/frontend
    restart: no

  datafeeder-backend:
    image: georchestra/datafeeder-python-backend:latest-local-executor
    # Tell FastAPI about the external Gateway prefix so Swagger requests the
    # OpenAPI definition from /datafeeder-backend/openapi.json.
    command:
      - sh
      - -c
      - >-
        /app/.venv/bin/alembic upgrade head &&
        exec /app/.venv/bin/uvicorn src.main:app --host 0.0.0.0 --port 8000
        --root-path /datafeeder-backend
    depends_on:
      datafeeder-db-init: {condition: service_completed_successfully}
      datadb: {condition: service_healthy}
      geoserver: {condition: service_healthy}
      geonetwork: {condition: service_healthy}
    volumes:
      - ./config:/etc/georchestra:ro
    env_file:
      - ./envs/common.env
      - ./envs/hosts.env
      - ./envs/ldap.env
      - ./envs/database-georchestra.env
    environment:
      DATADIR: /etc/georchestra
      DATADIR_PATH: /etc/georchestra
      DEBUG: "true"
      TASK_EXECUTOR: LOCAL
      BACKEND_INTERNAL_URL: http://localhost:8000
      POSTGRES_DATA_HOST: datadb
      POSTGRES_DATA_PORT: 5432
      POSTGRES_DATA_USER: postgres
      POSTGRES_DATA_PASSWORD: mypassword
      POSTGRES_DATA_DB: postgres
      SOURCE_DATABASES: >-
        {"LOCAL_FIXTURES":{"type":"copy","connection_string":"postgresql://postgres:mypassword@datadb:5432/postgres","label":"Local fixtures"}}
      GEOSERVER_INTERNAL_URL: http://gateway:8080/geoserver
      GEONETWORK_INTERNAL_URL: http://gateway:8080/geonetwork
      CONSOLE_INTERNAL_URL: http://gateway:8080/console
      DATA_PUBLIC_URL: https://georchestra-127-0-0-1.nip.io:${CADDY_HTTPS_PORT:-8443}/geoserver
      DATAHUB_PUBLIC_URL: https://georchestra-127-0-0-1.nip.io:${CADDY_HTTPS_PORT:-8443}/datahub/dataset/{metadata_id}
      METADATA_PUBLIC_URL: https://georchestra-127-0-0-1.nip.io:${CADDY_HTTPS_PORT:-8443}/geonetwork
      FRONTEND_HOST: https://georchestra-127-0-0-1.nip.io:${CADDY_HTTPS_PORT:-8443}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: no

configs:
  datadb_init_sql:
    content: |
      CREATE EXTENSION IF NOT EXISTS postgis;
      CREATE SCHEMA IF NOT EXISTS data;
      CREATE SCHEMA IF NOT EXISTS staging;
