# File included by gateway.yaml to set up the spring-gateway's routes
# target service URL's are defined in gateway.yaml (e.g. georchestra.gateway.services.<service>.target)

spring:
  cloud:
    gateway:
      routes:
      - id: root
        uri: ${georchestra.gateway.services.datahub.target}
        predicates:
        - Path=/
        filters:
        - RedirectTo=308, /geonetwork/
      - id: console
        uri: ${georchestra.gateway.services.console.target}
        predicates:
        - Path=/console/**
      - id: geonetwork
        uri: ${georchestra.gateway.services.geonetwork.target}
        predicates:
        - Path=/geonetwork/**
        filters:
        - name: CookieAffinity
          args:
            name: XSRF-TOKEN
            from: /geonetwork
            to: /datahub
      - id: geoserver
        uri: ${georchestra.gateway.services.geoserver.target}
        predicates:
        - Path=/geoserver/**
      - id: datafeeder
        uri: ${georchestra.gateway.services.datafeeder.target}
        predicates:
        - Path=/datafeeder/**
        filters:
        - RemoveRequestHeader=Forwarded
        - SetRequestHeader=X-Forwarded-Proto, https
      - id: import
        uri: ${georchestra.gateway.services.import.target}
        predicates:
        - Path=/import/**
        filters:
        - RewritePath=/import/(?<segment>.*),/$\{segment}
      - id: datahub
        uri: ${georchestra.gateway.services.datahub.target}
        predicates:
        - Path=/datahub/**
      - id: metadata-editor
        uri: ${georchestra.gateway.services.metadata-editor.target}
        predicates:
        - Path=/metadata-editor/**
      - id: maelstro-back
        uri: ${georchestra.gateway.services.maelstro-back.target}
        predicates:
        - Path=/maelstro-backend/**
        filters:
        - RewritePath=/maelstro-backend/(?<segment>.*),/$\{segment}
      - id: maelstro
        uri: ${georchestra.gateway.services.maelstro.target}
        predicates:
        - Path=/maelstro/**

georchestra.gateway.services:
  console.target: http://${CONSOLE_HOST}:8080/console/
  datafeeder.target: http://${DATAFEEDER_HOST}:8080/datafeeder/
  datahub.target: http://${DATAHUB_HOST}:80/datahub/
  metadata-editor.target: http://${METADATA_EDITOR_HOST:metadata-editor}:80/metadata-editor/
  geonetwork.target: http://${GEONETWORK_HOST}:8080/geonetwork/
  geoserver.target: http://${GEOSERVER_HOST}:8080/geoserver/
  import.target: http://${IMPORT_HOST}:80/
  maelstro-back.target: http://${MAELSTRO_HOST}:8000/
  maelstro.target: http://${MAELSTRO_FRONT_HOST}:8080/
